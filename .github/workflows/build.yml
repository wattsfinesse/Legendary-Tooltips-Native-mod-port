name: Build Legendary Tooltips Native

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mod source
        uses: actions/checkout@v4

      - name: Checkout matching LeviLamroid source
        uses: actions/checkout@v4
        with:
          repository: spygamingog/LeviLamroid
          # Pin to the source revision supplied with this port project.
          ref: f988a23c61889fda3ece324db1994077c5b4ed09
          path: LeviLamroid-main
          persist-credentials: false

      - name: Set up Android NDK r28c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: Configure build environment
        shell: bash
        run: |
          set -euo pipefail
          echo "LEVILAMROID_ROOT=${GITHUB_WORKSPACE}/LeviLamroid-main" >> "$GITHUB_ENV"

          # setup-ndk may install r28c into the runner tool cache while the hosted
          # image already has r27 installed under ANDROID_NDK_HOME. Do not reuse r27.
          NDK_TOOLCHAIN=""
          while IFS= read -r candidate; do
            case "$candidate" in
              *28.2.13676358*|*android-ndk-r28c*)
                NDK_TOOLCHAIN="$candidate"
                break
                ;;
            esac
          done < <(find "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" \
                    -type f -path '*/build/cmake/android.toolchain.cmake' -print 2>/dev/null || true)

          if [[ -z "$NDK_TOOLCHAIN" ]]; then
            echo "Could not locate the Android NDK r28c toolchain after setup-ndk." >&2
            echo "Available NDK toolchains:" >&2
            find "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}" "${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk" \
              -type f -path '*/build/cmake/android.toolchain.cmake' -print 2>/dev/null || true
            exit 1
          fi

          NDK_ROOT="${NDK_TOOLCHAIN%/build/cmake/android.toolchain.cmake}"
          NDK_ROOT="${NDK_ROOT%/build/cmake}"
          echo "ANDROID_NDK_HOME=${NDK_ROOT}" >> "$GITHUB_ENV"
          echo "Using Android NDK: ${NDK_ROOT}"
          test -f "${NDK_ROOT}/build/cmake/android.toolchain.cmake"
          cmake --version
          python3 --version

      - name: Build and package .levipack
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f CMakeLists.txt && -f package.sh ]]; then
            PROJECT_DIR="."
          elif [[ -f LegendaryTooltipsNative/CMakeLists.txt && -f LegendaryTooltipsNative/package.sh ]]; then
            PROJECT_DIR="LegendaryTooltipsNative"
          else
            echo "Could not find LegendaryTooltipsNative/CMakeLists.txt and package.sh" >&2
            exit 1
          fi
          chmod +x "${PROJECT_DIR}/package.sh"
          echo "Building with ANDROID_NDK_HOME=${ANDROID_NDK_HOME}"
          test -f "${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake"
          LEVILAMROID_ROOT="${GITHUB_WORKSPACE}/LeviLamroid-main" \
          ANDROID_NDK_HOME="${ANDROID_NDK_HOME}" \
            "${PROJECT_DIR}/package.sh"

      - name: Upload .levipack artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryTooltipsNative-Android-arm64
          path: |
            LegendaryTooltipsNative/dist/*.levipack
            dist/*.levipack
          if-no-files-found: error
          retention-days: 14
